name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # smithay-client-toolkit's build script resolves xkbcommon through
      # pkg-config and panics outright when xkbcommon.pc is missing, so the
      # crate does not compile at all without the dev package. This is the
      # only system library the build needs: wayland-backend is pulled in as
      # its pure Rust implementation, so nothing links libwayland, and the
      # protocol bindings are generated in-crate rather than by a system
      # wayland-scanner. The same missing .pc file is why the README tells
      # a developer to build inside `nix develop`.
      - name: Install xkbcommon headers
        run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev

      # `cargo clippy -- -D warnings` is deliberately NOT gated. It was tried and it failed on the
      # first run, on a lint that predates this workflow (`this if can be collapsed into the outer
      # match`), and the toolchain here floats on stable, so a new clippy release can redden main on
      # a commit that changed nothing. `cargo fmt` is out for a different reason: the sources are
      # hand formatted and rustfmt rewrites them, so a fmt check would fail on every commit.
      #
      # The suite is 42 pure logic tests over the PPM parser, the config and
      # filename rules, the niri IPC parsing, and the layout and damage maths.
      # None of them opens a Wayland connection, a D-Bus session or a display,
      # so a stock headless runner is enough.
      - run: cargo test --locked
